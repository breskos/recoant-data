name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: synthetic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - name: Check every data set against the catalog
        run: go test ./...
      - name: Check that the generator reproduces the files
        run: |
          go run ./cmd/gendata -out .
          git diff --exit-code
